<title>pocamaster 見比べチェック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* Layout: one column of card pairs under a sticky tally bar; big thumb-reach buttons under each pair */
:root{
  --bg:#f6f4f8; --surface:#ffffff; --ink:#26222e; --muted:#6f6879; --line:#e3dee9;
  --accent:#6b4fa0; --ok:#1f7a55; --ok-bg:#e3f4ec; --ng:#b3342f; --ng-bg:#fbe7e5; --flag:#a86a00; --flag-bg:#fff2d6;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17151c; --surface:#221f29; --ink:#eeeaf3; --muted:#a59db0; --line:#36313f;
  --accent:#b9a2e6; --ok:#5fd09c; --ok-bg:#173326; --ng:#ff8a80; --ng-bg:#3a1d1b; --flag:#f2b850; --flag-bg:#3a2d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17151c; --surface:#221f29; --ink:#eeeaf3; --muted:#a59db0; --line:#36313f;
  --accent:#b9a2e6; --ok:#5fd09c; --ok-bg:#173326; --ng:#ff8a80; --ng-bg:#3a1d1b; --flag:#f2b850; --flag-bg:#3a2d12; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-direction:column;gap:8px}
h1{font-family:var(--display);font-size:19px;margin:0;letter-spacing:.02em;text-wrap:balance}
.tally{display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums;font-size:13px}
.pill{padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.pill b{color:var(--ink)}
.pill.ok b{color:var(--ok)} .pill.ng b{color:var(--ng)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.status{font-size:12px;color:var(--muted)}
.intro{margin:16px 0 8px;color:var(--muted);font-size:14px}
h2{font-family:var(--display);font-size:16px;margin:28px 0 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
h2 small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.is-ok{border-color:var(--ok)} .card.is-ng{border-color:var(--ng)}
.head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-width:0}
.code{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.name{font-weight:700}
.src{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.flag{font-size:12px;background:var(--flag-bg);color:var(--flag);padding:1px 8px;border-radius:999px}
.pic{display:block;width:100%;height:auto;border-radius:6px;background:var(--bg)}
.cap{display:grid;grid-template-columns:1fr 1fr;font-size:12px;color:var(--muted);text-align:center;margin-top:-6px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{font:inherit;font-weight:700;font-size:15px;padding:12px 8px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btns .b-ok[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btns .b-ng[aria-pressed="true"]{background:var(--ng-bg);border-color:var(--ng);color:var(--ng)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);padding:24px 0;text-align:center}
</style>

<header><div class="bar">
  <h1>見比べチェック（7回目・8回目）</h1>
  <div class="tally" id="tally"></div>
  <div class="filters" id="filters">
    <button type="button" id="f-all" data-f="all" aria-pressed="true">全部</button>
    <button type="button" id="f-todo" data-f="todo" aria-pressed="false">まだ</button>
    <button type="button" id="f-ng" data-f="ng" aria-pressed="false">合っていない</button>
  </div>
  <div class="status" id="status">保存先に接続しています…</div>
</div></header>

<main class="wrap">
  <p class="intro">左が新しい写真、右が前の画像です。同じカードなら「合っている」、ちがうカードなら「合っていない」を押してください。押した結果は自動で保存され、Claude が読み取って直します。</p>
  <div id="groups"></div>
</main>

<script>
const ITEMS = __ITEMS__;
const state = {};           // id -> "ok" | "ng"
let filter = "all";
let db = null, store = "none";

function save(id, v){
  if (state[id] === v) { delete state[id]; } else { state[id] = v; }
  render();
  if (store === "db") {
    const ref = db.collection("checks").doc(id);
    (state[id] ? ref.set({v: state[id], at: new Date().toISOString()}) : ref.delete())
      .catch(e => setStatus("保存できませんでした（" + (e && e.code || "error") + "）。もう一度押してください。"));
  } else {
    try { localStorage.setItem("checks", JSON.stringify(state)); } catch(e) {}
  }
}

function setStatus(t){ document.getElementById("status").textContent = t; }

function render(){
  const ok = ITEMS.filter(i => state[i.id] === "ok").length;
  const ng = ITEMS.filter(i => state[i.id] === "ng").length;
  document.getElementById("tally").innerHTML =
    `<span class="pill ok">合っている <b>${ok}</b></span><span class="pill ng">合っていない <b>${ng}</b></span><span class="pill">まだ <b>${ITEMS.length-ok-ng}</b></span><span class="pill">全部 <b>${ITEMS.length}</b></span>`;
  const groups = document.getElementById("groups");
  groups.textContent = "";
  const order = [];
  const byG = {};
  for (const it of ITEMS) {
    const g = it.round + "｜" + it.group + "｜" + it.sheet;
    if (!byG[g]) { byG[g] = []; order.push(g); }
    byG[g].push(it);
  }
  let shown = 0;
  for (const g of order) {
    const list = byG[g].filter(it => filter === "all" || (filter === "todo" ? !state[it.id] : state[it.id] === "ng"));
    if (!list.length) continue;
    const [rnd, col, sheet] = g.split("｜");
    const h = document.createElement("h2");
    h.innerHTML = `${rnd}　${col} <small>番号は「${sheet} の 1」のように呼びます・${byG[g].length} 組</small>`;
    groups.appendChild(h);
    const box = document.createElement("div"); box.className = "list";
    for (const it of list) {
      shown++;
      const v = state[it.id];
      const c = document.createElement("article");
      c.className = "card" + (v === "ok" ? " is-ok" : v === "ng" ? " is-ng" : "");
      c.innerHTML = `
        <div class="head"><span class="code">${it.sheet} の ${it.no}</span><span class="name"></span><span class="src"></span>${it.flag ? '<span class="flag">前の画像がぼかし・特に見てください</span>' : ''}</div>
        <img class="pic" loading="lazy" alt="" src="${it.img}">
        <div class="cap"><span>新しい写真</span><span>前の画像</span></div>
        <div class="btns">
          <button type="button" class="b-ok" id="ok-${it.id}" aria-pressed="${v==='ok'}">合っている</button>
          <button type="button" class="b-ng" id="ng-${it.id}" aria-pressed="${v==='ng'}">合っていない</button>
        </div>`;
      c.querySelector(".name").textContent = it.member;
      c.querySelector(".src").textContent = (it.source + " " + it.version).trim();
      c.querySelector(".pic").alt = it.member + " の新しい写真と前の画像";
      c.querySelector(".b-ok").onclick = () => save(it.id, "ok");
      c.querySelector(".b-ng").onclick = () => save(it.id, "ng");
      box.appendChild(c);
    }
    groups.appendChild(box);
  }
  if (!shown) groups.innerHTML = '<p class="empty">この条件のカードはありません。</p>';
}

document.getElementById("filters").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  for (const x of document.querySelectorAll("#filters button")) x.setAttribute("aria-pressed", x === b);
  render();
});

render();

(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch(e) { db = null; }
  if (!db) {
    store = "local";
    try { Object.assign(state, JSON.parse(localStorage.getItem("checks") || "{}")); } catch(e) {}
    render();
    setStatus("この画面では Claude への保存ができません。押した結果はこの端末にだけ残ります。");
    return;
  }
  store = "db";
  const timer = setTimeout(() => setStatus("保存先につながるのを待っています。押した結果はつながりしだい保存されます。"), 10000);
  db.collection("checks").onSnapshot(snap => {
    for (const k of Object.keys(state)) delete state[k];
    for (const d of snap.docs) { const v = d.data() && d.data().v; if (v === "ok" || v === "ng") state[d.id] = v; }
    if (!snap.metadata.fromCache) { clearTimeout(timer); setStatus("押した結果は自動で保存されます。"); }
    render();
  }, e => { clearTimeout(timer); setStatus("保存先につながりませんでした（" + e.code + "）。ページを開き直してください。"); });
})();
</script>
